<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="ui-monospace, monospace" font-size="13">

  <!-- Background -->
  <rect width="780" height="480" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Patient Logger — System Architecture</text>

  <!-- ─── Docker Compose boundary ─── -->
  <rect x="20" y="54" width="740" height="406" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="36" y="72" fill="#475569" font-size="11">Docker Compose</text>

  <!-- ═══════════════════════════════ -->
  <!-- LAYER 1: Browser -->
  <!-- ═══════════════════════════════ -->
  <rect x="290" y="84" width="200" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="390" y="107" text-anchor="middle" fill="#38bdf8" font-weight="600">React Frontend</text>
  <text x="390" y="124" text-anchor="middle" fill="#94a3b8" font-size="11">React 19 · Router v7 · MUI v7</text>
  <text x="390" y="139" text-anchor="middle" fill="#94a3b8" font-size="11">AuthContext · Axios · role guards</text>

  <!-- Arrow down: Frontend → API -->
  <line x1="390" y1="154" x2="390" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="175" fill="#64748b" font-size="10">HTTP / REST + JWT</text>

  <!-- ═══════════════════════════════ -->
  <!-- LAYER 2: API -->
  <!-- ═══════════════════════════════ -->
  <rect x="190" y="188" width="400" height="90" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="390" y="211" text-anchor="middle" fill="#a78bfa" font-weight="600">Node.js API  (Express 5)</text>
  <text x="390" y="229" text-anchor="middle" fill="#94a3b8" font-size="11">JWT auth · bcrypt · role-based access control</text>
  <text x="390" y="245" text-anchor="middle" fill="#94a3b8" font-size="11">express-validator · helmet · cors · rate limiting</text>
  <text x="390" y="261" text-anchor="middle" fill="#94a3b8" font-size="11">jest · supertest</text>

  <!-- Arrow down-left: API → Postgres -->
  <line x1="310" y1="278" x2="230" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="314" fill="#64748b" font-size="10">pg pool</text>

  <!-- Arrow down-right: API → Redis -->
  <line x1="470" y1="278" x2="560" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="314" fill="#64748b" font-size="10">ioredis</text>

  <!-- ═══════════════════════════════ -->
  <!-- LAYER 3a: PostgreSQL -->
  <!-- ═══════════════════════════════ -->
  <rect x="60" y="330" width="280" height="100" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="354" text-anchor="middle" fill="#34d399" font-weight="600">PostgreSQL 15</text>
  <text x="200" y="372" text-anchor="middle" fill="#94a3b8" font-size="11">users · patients · task_logs</text>
  <text x="200" y="388" text-anchor="middle" fill="#94a3b8" font-size="11">Row Level Security (RLS)</text>
  <text x="200" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">hospital_id tenant scoping</text>
  <text x="200" y="420" text-anchor="middle" fill="#94a3b8" font-size="11">auto-run migrations on startup</text>

  <!-- ═══════════════════════════════ -->
  <!-- LAYER 3b: Redis -->
  <!-- ═══════════════════════════════ -->
  <rect x="440" y="330" width="280" height="100" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  <text x="580" y="354" text-anchor="middle" fill="#fb923c" font-weight="600">Redis 7</text>
  <text x="580" y="372" text-anchor="middle" fill="#94a3b8" font-size="11">rate limiting</text>
  <text x="580" y="388" text-anchor="middle" fill="#94a3b8" font-size="11">session / token caching</text>
  <text x="580" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">ephemeral state</text>

  <!-- ─── Arrow marker ─── -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

</svg>
