<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Recorded clinical alert decision workflow</title>
<desc id="desc">Synthetic input flows through deterministic rules and routing, then optional model explanation or complete rules-only fallback. SQLite commits the record before queue publication. Human review appends versioned acceptance, overrides and feedback while preserving the original decision.</desc>
<rect width="960" height="680" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f172a">
<text x="480" y="40" font-size="25" font-weight="700">Who owns the recorded decision?</text>
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
<rect x="100" y="65" width="760" height="55" rx="10"/>
<rect x="100" y="145" width="760" height="55" rx="10"/>
<rect x="100" y="225" width="760" height="55" rx="10"/>
<rect x="100" y="305" width="760" height="75" rx="10"/>
<rect x="100" y="405" width="760" height="55" rx="10"/>
<rect x="100" y="485" width="760" height="55" rx="10"/>
<rect x="100" y="565" width="760" height="75" rx="10"/>
</g>
<g font-size="21">
<text x="480" y="100">Synthetic alert input</text>
<text x="480" y="180">Rules assign priority and preserve evidence</text>
<text x="480" y="260">Deterministic router selects destination</text>
<text x="480" y="336">Optional model explains the completed decision</text>
<text x="480" y="365" font-size="18">Validation or provider failure → six-section rules-only explanation</text>
<text x="480" y="440">SQLite commits decision and explanation</text>
<text x="480" y="520">Queue publishes the saved record</text>
<text x="480" y="596">Human review appends acceptance, override or feedback</text>
<text x="480" y="625" font-size="18">Versioned review preserves the original decision</text>
</g>
<g font-size="23" fill="#0369a1"><text x="480" y="140">↓</text><text x="480" y="220">↓</text><text x="480" y="300">↓</text><text x="480" y="400">↓</text><text x="480" y="480">↓</text><text x="480" y="560">↓</text></g>
</g></svg>
