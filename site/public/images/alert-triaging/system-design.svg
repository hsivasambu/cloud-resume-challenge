<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc">
  <title id="title">Clinical alert triage system design</title>
  <desc id="desc">The Vercel browser interface submits a simulated alert to the backend and receives a saved result. The backend runs rules, requests an explanation and optional escalation from the OpenAI model, checks the response, limits any increase to one priority level and selects the destination team. SQLite stores decisions, explanations and review history. A failed model call leaves a rules-based result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="710" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="40" y="45" font-size="26" font-weight="700">Rules first, a bounded request to AI</text>
    <rect x="40" y="75" width="450" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="265" y="111" text-anchor="middle" font-size="23" font-weight="700">Browser interface · Vercel</text>
    <text x="265" y="143" text-anchor="middle" font-size="20">Submit alert · display saved result</text>

    <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
      <path d="M100 170V250"/>
      <path d="M445 250V170"/>
    </g>
    <text x="115" y="211" font-size="18">Alert request</text>
    <text x="290" y="211" font-size="18">Saved result</text>

    <rect x="40" y="250" width="450" height="270" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="65" y="290" font-size="24" font-weight="700">Backend API</text>
    <text x="65" y="331" font-size="21">1. Rules set baseline priority</text>
    <text x="65" y="372" font-size="21">2. Request AI explanation / proposal</text>
    <text x="65" y="413" font-size="21">3. Check evidence + priority limits</text>
    <text x="65" y="454" font-size="21">4. Route to team + save result</text>
    <text x="65" y="492" font-size="18" fill="#475569">Model unavailable or rejected → rules only</text>

    <rect x="670" y="305" width="250" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="795" y="345" text-anchor="middle" font-size="23" font-weight="700">OpenAI model</text>
    <text x="795" y="383" text-anchor="middle" font-size="20">Explain supplied context</text>
    <text x="795" y="416" text-anchor="middle" font-size="19">Propose escalation</text>

    <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
      <path d="M490 325H670"/>
      <path d="M670 435H490"/>
    </g>
    <text x="580" y="280" text-anchor="middle" font-size="18">Context +</text>
    <text x="580" y="304" text-anchor="middle" font-size="18">rules baseline</text>
    <text x="580" y="470" text-anchor="middle" font-size="18">Explanation +</text>
    <text x="580" y="494" text-anchor="middle" font-size="18">proposal</text>

    <path d="M265 520V580" fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="285" y="555" font-size="18">Save / load</text>
    <rect x="40" y="580" width="450" height="95" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="265" y="616" text-anchor="middle" font-size="23" font-weight="700">SQLite storage</text>
    <text x="265" y="649" text-anchor="middle" font-size="19">Decisions · explanations · review history</text>

    <text x="540" y="581" font-size="20" font-weight="700">Backend keeps authority</text>
    <text x="540" y="615" font-size="19">AI: one level up, never down</text>
    <text x="540" y="647" font-size="19">Code: checks + destination team</text>
    <text x="540" y="679" font-size="19">API key stays on the server</text>
  </g>
</svg>
