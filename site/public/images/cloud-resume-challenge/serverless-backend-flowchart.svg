<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="ui-monospace, monospace" font-size="13">

  <!-- Background -->
  <rect width="820" height="280" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Part 2 — Serverless Backend Architecture</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ═══ NODE 1: Browser ═══ -->
  <rect x="30" y="96" width="140" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" fill="#38bdf8" font-weight="600">Browser</text>
  <text x="100" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">page loaded via</text>
  <text x="100" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">CloudFront / S3</text>
  <text x="100" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">JS calls API</text>

  <!-- Arrow 1 → 2 -->
  <line x1="170" y1="140" x2="208" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="189" y="130" text-anchor="middle" fill="#64748b" font-size="10">HTTPS</text>

  <!-- ═══ NODE 2: API Gateway ═══ -->
  <rect x="210" y="96" width="155" height="88" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="287" y="122" text-anchor="middle" fill="#a78bfa" font-weight="600">API Gateway</text>
  <text x="287" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">routes requests</text>
  <text x="287" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">CORS · throttling</text>
  <text x="287" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">GET · POST /count</text>

  <!-- Arrow 2 → 3 -->
  <line x1="365" y1="140" x2="403" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="384" y="130" text-anchor="middle" fill="#64748b" font-size="10">invokes</text>

  <!-- ═══ NODE 3: Lambda ═══ -->
  <rect x="405" y="80" width="200" height="120" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  <text x="505" y="106" text-anchor="middle" fill="#fb923c" font-weight="600">AWS Lambda</text>
  <text x="505" y="124" text-anchor="middle" fill="#94a3b8" font-size="11">stateless · event-driven</text>
  <text x="505" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">GET → read counter</text>
  <text x="505" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">POST → atomic increment</text>
  <text x="505" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">no servers to manage</text>
  <text x="505" y="188" text-anchor="middle" fill="#94a3b8" font-size="11">scales to zero</text>

  <!-- Arrow 3 → 4 -->
  <line x1="605" y1="140" x2="643" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="624" y="130" text-anchor="middle" fill="#64748b" font-size="10">read/write</text>

  <!-- ═══ NODE 4: DynamoDB ═══ -->
  <rect x="645" y="96" width="145" height="88" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="717" y="122" text-anchor="middle" fill="#34d399" font-weight="600">DynamoDB</text>
  <text x="717" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">key-value store</text>
  <text x="717" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">atomic updates</text>
  <text x="717" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">visitor_count item</text>

  <!-- Return arc: DynamoDB → Browser (response path) -->
  <path d="M645,175 Q410,248 170,175" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dim)"/>
  <text x="410" y="250" text-anchor="middle" fill="#475569" font-size="10">response returned to browser</text>

  <!-- ─── Legend ─── -->
  <line x1="30" y1="265" x2="60" y2="265" stroke="#475569" stroke-width="1.5"/>
  <text x="66" y="269" fill="#64748b" font-size="11">request path</text>
  <line x1="178" y1="265" x2="208" y2="265" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="214" y="269" fill="#64748b" font-size="11">response path</text>

</svg>
