<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="ui-monospace, monospace" font-size="13" role="img" aria-label="Browser resolves the domain through DNS, then requests content from CloudFront, which fetches S3 on a cache miss">
  <rect width="820" height="320" fill="#0f1117" rx="12"/>
  <text x="410" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Portfolio hosting: DNS and content delivery</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>
  <rect x="40" y="200" width="160" height="80" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="120" y="227" text-anchor="middle" fill="#38bdf8">Browser</text>
  <text x="120" y="248" text-anchor="middle" fill="#b2bdcb" font-size="11">resolves domain</text>
  <text x="120" y="265" text-anchor="middle" fill="#b2bdcb" font-size="11">then requests page</text>
  <rect x="40" y="65" width="240" height="75" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <text x="160" y="92" text-anchor="middle" fill="#a78bfa">DNS / Route 53</text>
  <text x="160" y="115" text-anchor="middle" fill="#b2bdcb" font-size="11">domain points to CloudFront</text>
  <line x1="100" y1="200" x2="100" y2="142" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <line x1="150" y1="140" x2="150" y2="198" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <text x="175" y="170" fill="#b2bdcb" font-size="11">DNS answer</text>
  <rect x="350" y="175" width="240" height="110" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="470" y="203" text-anchor="middle" fill="#f59e0b">CloudFront</text>
  <text x="470" y="226" text-anchor="middle" fill="#b2bdcb" font-size="11">HTTPS · cached content</text>
  <text x="470" y="245" text-anchor="middle" fill="#b2bdcb" font-size="11">OAC to private blog origin</text>
  <text x="470" y="264" text-anchor="middle" fill="#b2bdcb" font-size="11">invalidation after deploy</text>
  <line x1="200" y1="230" x2="348" y2="230" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <text x="275" y="216" text-anchor="middle" fill="#b2bdcb" font-size="11">HTTPS</text>
  <rect x="675" y="200" width="120" height="80" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="735" y="227" text-anchor="middle" fill="#34d399">Amazon S3</text>
  <text x="735" y="251" text-anchor="middle" fill="#b2bdcb" font-size="11">static files</text>
  <line x1="590" y1="230" x2="673" y2="230" stroke="#94a3b8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="632" y="215" text-anchor="middle" fill="#b2bdcb" font-size="10">cache miss</text>
</svg>
